server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /usr/share/nginx/html;

    gzip on;
    gzip_vary on;
    gzip_min_length 256;
    gzip_proxied any;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # Dokploy / load balancer probe. The only path that is not a 404.
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Hashed build artefacts are immutable.
    location /_app/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # The lot is empty, so "/" is a 404 like everything else. Without this the
    # http-level `index index.html` would happily serve the page with a 200.
    location = / {
        return 404;
    }

    # Real files (robots.txt, ...) are served; everything else falls through.
    location / {
        try_files $uri =404;
    }

    # Rendered for every 404, which is to say for every request.
    error_page 404 /404.html;
    location = /404.html {
        internal;
        add_header Cache-Control "no-store";
    }
}
